<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">

<meta name="apple-mobile-web-app-title" content="mp的职业兽医规划">
<title>mp的职业兽医规划</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--main:#2563eb;--ok:#059669;--bad:#dc2626;--amber:#f59e0b}
*{box-sizing:border-box}
body{margin:0;padding:0 0 calc(76px + env(safe-area-inset-bottom));background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
.wrap{max-width:780px;margin:0 auto;padding:10px 12px}
.muted{color:var(--muted)}.small{font-size:13px}
.top{background:var(--card);border-radius:14px;padding:14px 16px;margin:10px 0 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.brand{font-size:15px;color:var(--muted);font-weight:600}
.bigday{font-size:26px;font-weight:800;margin:2px 0 2px}
.bigday b{color:var(--main);font-size:32px}
.countdown{font-size:14px;color:var(--muted);margin:0 0 10px}
.countdown b{color:var(--bad);font-size:17px}
.prog{height:10px;background:#e9edf3;border-radius:6px;overflow:hidden}
#progBar{height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#2563eb)}
.progtext{font-size:13px;color:var(--muted);margin-top:6px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cardtitle{font-size:17px;margin:0 0 10px}
.dayhd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.daynum{font-size:22px;font-weight:800;color:var(--main)}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:600;color:#fff}
.theme{font-size:20px;margin:8px 0 4px}
h3.sub{font-size:15px;margin:16px 0 6px;color:#374151}
.list{margin:0;padding-left:20px}.list li{margin:5px 0}
.box{background:#fffbeb;border-left:4px solid var(--amber);border-radius:8px;padding:9px 12px;margin-top:6px}
.box.q{background:#eff6ff;border-left-color:#3b82f6}
.meta{margin-top:14px;font-size:14px;color:var(--muted);background:#f8fafc;border-radius:8px;padding:8px 12px}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--main);background:var(--main);color:#fff;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.full{width:100%;margin-top:14px}
.btn.done{background:var(--ok);border-color:var(--ok)}
.btn.ghost{background:#fff;color:var(--main)}
.btn.small{min-height:40px;font-size:15px;padding:0 14px;font-weight:600}
.btn.danger{background:#fff;color:var(--bad);border-color:#fecaca}
.raterow{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.stars{display:flex;gap:8px}
.star{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1;color:#d1d5db;cursor:pointer;font-family:inherit}
.star.on{color:var(--amber);border-color:#fcd34d;background:#fffbeb}
.navrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.navrow .btn{flex:1;min-width:96px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:13px;background:#fafbfc}
tr.rowday{cursor:pointer}
tr.rowday.curday{background:#eff6ff}
td.num{font-weight:800;color:var(--main);width:44px;white-space:nowrap}
td.st{width:50px;text-align:center}
.dot{display:inline-block;background:var(--main);color:#fff;border-radius:4px;font-size:11px;padding:0 4px;margin-left:4px;vertical-align:2px;font-weight:400}
.datarow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.datarow input[type=date]{font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-family:inherit}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.tip{font-size:13px;color:var(--muted);margin:10px 0 0}
footer{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 0}
.bottombar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:10px;align-items:center;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.bottombar .btn{min-height:46px}
.bottombar .arrow{flex:0 0 56px;padding:0;font-size:20px}
.bottombar #barDone{flex:1;margin:0}
@media (max-width:640px){.bottombar{display:flex}}
@media (min-width:641px){body{padding-bottom:40px}}
@media (max-width:520px){table{font-size:13px}th,td{padding:8px 4px}td.num{width:36px}td.st{width:38px}.wrap{padding:8px 10px}.card{padding:12px 13px}.bigday{font-size:22px}.bigday b{font-size:28px}}
</style>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">mp的职业兽医规划 · 2026.10.30 — 2027.7.15</div>
    <div class="bigday">今天第 <b id="dayNum">1</b> 天 <span class="small muted" id="dayDate"></span></div>
    <div class="countdown" id="countdown"></div>
    <div class="prog"><div id="progBar"></div></div>
    <div class="progtext" id="progText">已完成 0 天</div>
  </header>

  <main id="dayPanel"></main>

  <section class="card">
    <h2 class="cardtitle">📅 总览（点某一天查看）</h2>
    <table>
      <thead><tr><th>天</th><th>日期</th><th>科目 · 章节</th><th>打卡</th></tr></thead>
      <tbody id="ovBody"></tbody>
    </table>
  </section>

  <section class="card">
    <h2 class="cardtitle">💾 数据管理</h2>
    <div class="datarow">
      <label class="muted small">计划开始日期</label>
      <input type="date" id="startInput">
    </div>
    <div class="btnrow">
      <button class="btn ghost small" id="btnExport">导出数据</button>
      <button class="btn ghost small" id="btnImport">导入数据</button>
      <input type="file" id="fileInput" accept=".json,application/json" hidden>
    </div>
    <div class="btnrow"><button class="btn danger small" id="btnReset">清空所有记录</button></div>
    <p class="tip">数据只存在这台设备的浏览器里。换手机先“导出数据”，到新设备再“导入数据”。</p>
  </section>

  <footer>每天 30 分钟 · 周日错题 · 20 天小测 · 每月 2 天缓冲</footer>
</div>

<div class="bottombar">
  <button class="btn ghost arrow" data-nav="-1" aria-label="前一天">←</button>
  <button class="btn" id="barDone">今日打卡</button>
  <button class="btn ghost arrow" data-nav="1" aria-label="后一天">→</button>
</div>

(function(){
"use strict";
var KEY="mpvet_v1", START="2026-10-30", END="2027-07-15", TOTAL=PLAN.length;
var COLORS={"基础":"#2563eb","预防":"#059669","临床":"#d97706","综合":"#7c3aed","错题日":"#6b7280","缓冲":"#6b7280","小测日":"#dc2626","提醒":"#dc2626","模考":"#7c3aed","考前":"#374151"};

function $(s){return document.querySelector(s);}
function pad(n){return n<10?"0"+n:""+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function todayISO(){return iso(new Date());}
function addDays(s,n){var d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return iso(d);}
function diff(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function load(){
  var def={start:START,done:{},rate:{},cur:0};
  try{var r=localStorage.getItem(KEY); if(!r)return def; var o=JSON.parse(r)||{};
    return {start:o.start||START,done:o.done||{},rate:o.rate||{},cur:o.cur||0};}catch(e){return def;}
}
var ST=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){alert("保存失败：浏览器禁用了本地存储");}}

function clamp(n){return Math.max(1,Math.min(TOTAL,n));}
function todayDay(){return clamp(diff(ST.start,todayISO())+1);}
var cur=(ST.cur>=1&&ST.cur<=TOTAL)?ST.cur:todayDay();

function renderTop(){
  var td=todayDay();
  $("#dayNum").textContent=td;
  $("#dayDate").textContent="（"+addDays(ST.start,td-1)+"）";
  var left=diff(todayISO(),END);

  var doneN=0; for(var i=1;i<=TOTAL;i++){ if(ST.done[i]) doneN++; }
  $("#progBar").style.width=(doneN/TOTAL*100)+"%";
  $("#progText").textContent="已完成 "+doneN+" / "+TOTAL+" 天";
}

function starsHTML(){
  var r=ST.rate[cur]||0,s="";

  return s;
}
function renderBar(){

}

  var color=COLORS[p.s]||"#374151";

  var html='<section class="card">'
    +'<div class="dayhd"><span class="daynum">第 '+cur+' 天</span><span class="tag" style="background:'+color+'">'+esc(p.s)+'</span></div>'
    +'<div class="small muted">'+addDays(ST.start,cur-1)+(doneDate?"　·　打卡于 "+doneDate:"")+'</div>'
    +'<h2 class="theme">'+esc(p.t)+'</h2>'
    + hint
    + (p.n ? '<h3 class="sub">📝 考点速记（背这几条就够）</h3><ul class="list">'+p.n.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul>' : '')
    +'<h3 class="sub">📖 今天怎么做</h3><ul class="list">'+p.c.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul>'
    +'<h3 class="sub">✍️ 任务</h3><div class="box q"><b>刷题量：</b>'+esc(p.q)+'</div>'
    +'<div class="box"><b>完成标准：</b>'+esc(p.std)+'</div>'
    +'<div class="meta">⏱ 预计 '+(p.q.indexOf("60分钟")>=0?"60 分钟（限时刷题日）":"30 分钟")+'</div>'
    +'<button class="btn full'+(doneDate?" done":"")+'" id="btnDone">'+(doneDate?"已完成打卡 ✓（点一下可撤销）":"今日打卡")+'</button>'
    +'<div class="raterow"><span class="small muted">今日自评：</span><span class="stars" id="rateBox">'+starsHTML()+'</span></div>'
    +'<div class="navrow"><button class="btn ghost small" data-nav="-1">← 前一天</button><button class="btn ghost small" data-nav="0">回到今天</button><button class="btn ghost small" data-nav="1">后一天 →</button></div>'
    +'</section>';
  $("#dayPanel").innerHTML=html;
  renderBar();
}
function renderOverview(){
  var td=todayDay(),rows="";
  for(var i=0;i<PLAN.length;i++){
    var p=PLAN[i],done=!!ST.done[p.d];
    rows+='<tr class="rowday'+(p.d===cur?" curday":"")+'" data-day="'+p.d+'">'
      +'<td class="num">'+p.d+(p.d===td?'<span class="dot">今</span>':'')+'</td>'
      +'<td class="small muted">'+addDays(ST.start,p.d-1).slice(5)+'</td>'
      +'<td>'+esc(p.s)+' · '+esc(p.t)+'</td>'
      +'<td class="st">'+(done?"✅":"—")+'</td></tr>';
  }
  $("#ovBody").innerHTML=rows;
}
function goDay(n){
  cur=clamp(n); ST.cur=cur; save();
  renderDay(); renderOverview();
  var el=document.getElementById("dayPanel");
  if(el&&el.scrollIntoView) el.scrollIntoView({block:"start"});
}
function toggleDone(){
  if(ST.done[cur]){
    if(!confirm("撤销第 "+cur+" 天的打卡吗？")) return;
    delete ST.done[cur];
  } else { ST.done[cur]=todayISO(); }
  save(); renderDay(); renderTop(); renderOverview();
}
document.addEventListener("click",function(e){
  var t=e.target;
  var nav=t.closest("[data-nav]");
  if(nav){ var n=+nav.dataset.nav; goDay(n===0?todayDay():cur+n); return; }
  var st=t.closest("[data-rate]");
  if(st){ ST.rate[cur]=+st.dataset.rate; save(); $("#rateBox").innerHTML=starsHTML(); return; }
  var row=t.closest("tr[data-day]");
  if(row){ goDay(+row.dataset.day); return; }
  if(t.id==="btnDone"||t.id==="barDone") toggleDone();
});
$("#btnExport").addEventListener("click",function(){
  var data={app:"mpvet",version:1,exportedAt:new Date().toISOString(),start:ST.start,done:ST.done,rate:ST.rate};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"});
  var url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url; a.download="mp的职业兽医规划_备份_"+todayISO()+".json";
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
});
$("#btnImport").addEventListener("click",function(){$("#fileInput").click();});
$("#fileInput").addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o||!o.done) throw new Error("格式不对");
      if(!confirm("导入会覆盖现有记录，确定吗？")) return;
      ST.start=o.start||ST.start; ST.done=o.done||{}; ST.rate=o.rate||{};
      cur=todayDay(); ST.cur=cur; save(); renderAll(); alert("导入成功！");
    }catch(err){ alert("导入失败："+err.message); }
    finally{ e.target.value=""; }
  };
  r.readAsText(f,"utf-8");
});
$("#btnReset").addEventListener("click",function(){
  if(!confirm("清空所有打卡和自评？建议先导出备份。")) return;
  ST.done={}; ST.rate={}; ST.cur=0; save(); cur=todayDay(); renderAll();
});
$("#startInput").addEventListener("change",function(){
  if(!this.value) return;
  ST.start=this.value; save(); renderTop(); renderDay(); renderOverview();
});
function renderAll(){ renderTop(); renderDay(); renderOverview(); $("#startInput").value=ST.start; }
renderAll();
})();
</script>
<script>
/* 离线条：第一次打开时把页面存进缓存，之后断网也能开 */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
